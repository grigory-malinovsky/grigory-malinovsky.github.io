<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Communication-efficient federated learning</title>
  <desc id="desc">Four clients perform local training and exchange compressed updates with a shared model.</desc>
  <rect width="320" height="180" rx="8" fill="#f7fafb"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#494e52">
    <g fill="none" stroke="#8fbdcb" stroke-width="2">
      <path d="M70 51L136 78M250 51L184 78M70 129L136 102M250 129L184 102"/>
    </g>
    <g fill="#fff" stroke="#52adc8" stroke-width="2">
      <rect x="32" y="29" width="76" height="36" rx="5"/>
      <rect x="212" y="29" width="76" height="36" rx="5"/>
      <rect x="32" y="115" width="76" height="36" rx="5"/>
      <rect x="212" y="115" width="76" height="36" rx="5"/>
      <circle cx="160" cy="90" r="34" fill="#e6f3f7"/>
    </g>
    <g text-anchor="middle">
      <text x="70" y="51">Local steps</text><text x="250" y="51">Local steps</text>
      <text x="70" y="137">Local steps</text><text x="250" y="137">Local steps</text>
      <text x="160" y="87">Shared</text><text x="160" y="102">model</text>
      <text x="160" y="20" fill="#36788b">Compressed updates</text>
    </g></g>
</svg>
