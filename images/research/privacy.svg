    </g>
    <g fill="#dbeff4" stroke="#52adc8" stroke-width="2">
      <circle cx="49" cy="48" r="16"/><circle cx="49" cy="90" r="16"/><circle cx="49" cy="132" r="16"/>
      <path d="M160 51L191 65V94Q191 115 160 130Q129 115 129 94V65Z" fill="#fff"/>
      <rect x="148" y="83" width="24" height="20" rx="3" fill="#dbeff4"/>
